# Project-wide Gradle settings.
# Specifies the JVM arguments used for the daemon process.
# Tweaked memory settings for fast Kotlin, KSP, and Compose compilation.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Parallel compilation & build caching
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin incremental compilation
kotlin.incremental=true
kotlin.code.style=official

android.disallowKotlinSourceSets=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
